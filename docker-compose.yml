services:
  manejarr:
    build: .
    image: manejarr
    container_name: manejarr
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - TZ=${TZ:-UTC}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - NODE_ENV=production
      - ENCODING_CLEANUP=${ENCODING_CLEANUP:-false}
      - CLEANUP_STORAGE=${CLEANUP_STORAGE:-local}
      - CLEANUP_HELPER_URL=${CLEANUP_HELPER_URL:-}
      - CLEANUP_HELPER_TOKEN=${CLEANUP_HELPER_TOKEN:-}
      - CLEANUP_RADARR_OUTPUT=${CLEANUP_RADARR_OUTPUT:-/downloads/completed}
      - CLEANUP_SONARR_OUTPUT=${CLEANUP_SONARR_OUTPUT:-/downloads/completed}
      - CLEANUP_RADARR_LIBRARY=${CLEANUP_RADARR_LIBRARY:-/media}
      - CLEANUP_SONARR_LIBRARY=${CLEANUP_SONARR_LIBRARY:-/media}
    volumes:
      - manejarr_data:/app/data

volumes:
  manejarr_data:
